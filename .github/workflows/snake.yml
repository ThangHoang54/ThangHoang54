# GitHub Action for generating a contribution graph with a snake eating your contributions.
name: Generate Snake

on:
  schedule:
    # Runs at 00:00 (midnight) every Sunday
    - cron: "0 0 * * 0"
  
  workflow_dispatch:

# Grant the action permission to write back to your repository
permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Generate Snake
        uses: Platane/snk@v3
        id: snake-gif
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            ./assets/github-snake.svg
            ./assets/github-snake-dark.svg?palette=github-dark
            ./assets/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: Upload to repo
        run: |
          git config --global user.email "176979010+ThangHoang54@users.noreply.github.com"
          git config --global user.name "ThangHoang54"
          git add .
          git diff --staged --quiet || (git commit -m "chore: :+1: image snake" && git push)
